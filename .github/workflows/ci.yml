name: Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    name: Build, Test & Package
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore l0llm.sln

      - name: Build Solution
        run: dotnet build l0llm.sln --configuration Release --no-restore

      - name: Run Tests
        run: dotnet test tests/HFLabs.ML.LLM.LevelZero.Tests/HFLabs.ML.LLM.LevelZero.Tests.csproj --configuration Release --no-build

      - name: Publish Self-Contained Binary (win-x64)
        run: |
          dotnet publish src/l0llm/l0llm.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o dist/l0llm-win-x64
          Copy-Item package/* dist/l0llm-win-x64/
          Compress-Archive -Path dist/l0llm-win-x64/* -DestinationPath dist/l0llm-win-x64.zip -Force

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: l0llm-win-x64
          path: dist/l0llm-win-x64.zip

      - name: Release to GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/l0llm-win-x64.zip
          generate_release_notes: true
